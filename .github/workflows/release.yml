name: Release

# Two ways in (docs/PLAN.md, D10/D11):
#  - a pushed tag on main: scripts\tag.ps1 -Push (or git tag v0.2.0 && git push origin v0.2.0)
#  - called by the "Tag release" workflow (tag.yml) with the tag it just created. Tags pushed with
#    GITHUB_TOKEN do not trigger workflows, so tag.yml calls this one directly (no double release).
# The version comes from the tag (v0.2.0 -> 0.2.0, v0.2.0-rc1 -> 0.2.0-rc1, published as a pre-release).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      # On push the tag is the ref; when called, github.ref is the caller's branch, so use the input.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0 # to check that the tag is on main

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' is not vX.Y.Z or vX.Y.Z-suffix" }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          # Releases come from main (docs/PLAN.md, D9).
          $commit = git rev-parse "refs/tags/$tag^{commit}"
          git fetch origin main --quiet
          git merge-base --is-ancestor $commit origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $tag is not on main; merge develop into main first, then tag main" }
          Write-Host "Releasing WinSSH $version from $commit"

      - name: Set up vcpkg at the manifest baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Configure
        run: cmake --preset default -DWINSSH_VERSION=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Package
        shell: pwsh
        run: |
          .\scripts\package.ps1 -Version ${{ steps.version.outputs.version }}
          Get-ChildItem build\dist -File -Exclude SHA256SUMS.txt | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content build\dist\SHA256SUMS.txt -Encoding ascii
          Get-Content build\dist\SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WinSSH ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            build/dist/WinSSH-setup-${{ steps.version.outputs.version }}.exe
            build/dist/WinSSH-portable-${{ steps.version.outputs.version }}.zip
            build/dist/SHA256SUMS.txt
