name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      # vcpkg's default "files" binary cache, saved between runs with actions/cache
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up vcpkg at the manifest baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Smoke test
        shell: pwsh
        run: .\build\Release\WinSSH.exe --version

      - name: Upload WinSSH.exe
        uses: actions/upload-artifact@v4
        with:
          name: WinSSH-${{ github.sha }}
          path: build/Release/WinSSH.exe
